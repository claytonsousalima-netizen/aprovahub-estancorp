# ============================================================
# GitHub Actions — Deploy Workflow
#
# Trigger:
#   - Pull Request para main-aws:
#       Apenas valida o build da imagem
#
#   - Push para main-aws:
#       Build + Push GHCR + Deploy AWS EC2 via SSM
#
# Ambiente:
#   AWS EC2
#   Docker Swarm
#   AWS Systems Manager (SSM)
#   GitHub Container Registry (GHCR)
# ============================================================

name: deploy-aws

on:
  pull_request:
    branches:
      - main-aws

  push:
    branches:
      - main-aws


# ============================================================
# Variáveis globais
# ============================================================

env:
  REGISTRY: ghcr.io

  IMAGE_NAME: aprovahub-estancorp

  AWS_REGION: us-east-1

  STACK_NAME: aprovahub-estancorp

  SERVICE_NAME: aprovahub-estancorp_app

  COMPOSE_FILE: /opt/app-aprovahub/docker-compose.yml

  APP_PORT: 8085


# ============================================================
# JOB 1
# Smoke Build
#
# Executado em PR e PUSH.
# Apenas garante que o Dockerfile continua válido.
# ============================================================

jobs:

  smoke-build:

    name: Smoke Build (Validate Dockerfile)

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # QEMU
      # Necessário para build ARM64
      # --------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Smoke Build
      # Não envia imagem para o registry
      # --------------------------------------------------------

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:

          context: .

          platforms: linux/arm64

          push: false

          cache-from: type=gha

          cache-to: type=gha,mode=max


# ============================================================
# JOB 2
# Build + Push + Deploy
#
# Executado somente em PUSH para main-aws
# ============================================================

  build-and-deploy:

    name: Build & Deploy to AWS

    runs-on: ubuntu-latest

    needs:
      - smoke-build

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write


    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # QEMU
      # --------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64


      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Login no GHCR
      # --------------------------------------------------------

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:

          registry: ${{ env.REGISTRY }}

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build + Push
      #
      # Gera:
      #
      # ghcr.io/<org>/aprovahub-estancorp:<commit-sha>
      # ghcr.io/<org>/aprovahub-estancorp:latest
      # --------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:

          context: .

          platforms: linux/arm64

          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha

          cache-to: type=gha,mode=max


      # --------------------------------------------------------
      # AWS Authentication
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Localizar EC2
      #
      # Procura a máquina pela TAG:
      #
      # Name=estancorp-rouparia-prod-app
      #
      # (VM compartilhada por todas as stacks Docker Swarm do projeto —
      # rouparia, govhotel, bi-hoteis. ATENÇÃO: se futuramente existir uma
      # EC2 específica para aprovahub, trocar esta TAG.)
      # --------------------------------------------------------

      - name: Find EC2 instance
        id: find-instance

        run: |

          set -euo pipefail

          echo "Finding EC2 instance..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=estancorp-rouparia-prod-app" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region "${AWS_REGION}")

          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then

            echo "ERROR: Could not find running EC2 instance."

            echo "Expected tag:"
            echo "Name=estancorp-rouparia-prod-app"

            exit 1

          fi

          echo "Found instance: ${INSTANCE_ID}"

          echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"


      # --------------------------------------------------------
      # Criar e enviar script de deploy para EC2 via SSM
      # --------------------------------------------------------

      - name: Execute deployment on EC2 via SSM
        id: ssm-deploy

        env:

          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}

          IMAGE_TAG: ${{ github.sha }}

          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GHCR_USERNAME: ${{ github.actor }}

          REGISTRY_ORG: ${{ github.repository_owner }}

        run: |

          set -euo pipefail


          # ====================================================
          # Token GHCR em Base64
          #
          # Evita substituir diretamente secrets via sed.
          # ====================================================

          GHCR_TOKEN_B64=$(printf '%s' "${GHCR_TOKEN}" | base64 -w 0)


          # ====================================================
          # Script que será executado dentro da EC2
          # ====================================================

          cat > /tmp/deploy.sh << 'DEPLOYEOF'

          #!/bin/bash

          set -euo pipefail


          echo "============================================================"
          echo "Deploy: aprovahub-estancorp"
          echo "============================================================"


          # ====================================================
          # Configurações
          # ====================================================

          STACK_NAME="aprovahub-estancorp"

          SERVICE_NAME="aprovahub-estancorp_app"

          COMPOSE_FILE="/opt/app-aprovahub/docker-compose.yml"

          APP_DIR="/opt/app-aprovahub"

          APP_PORT="8085"

          IMAGE_TAG="IMAGE_TAG_PLACEHOLDER"

          REGISTRY_ORG="REGISTRY_ORG_PLACEHOLDER"

          GHCR_USERNAME="GHCR_USERNAME_PLACEHOLDER"

          GHCR_TOKEN_B64="GHCR_TOKEN_B64_PLACEHOLDER"


          IMAGE="ghcr.io/${REGISTRY_ORG}/aprovahub-estancorp:${IMAGE_TAG}"


          echo ""
          echo "Stack:"
          echo "${STACK_NAME}"

          echo ""
          echo "Compose:"
          echo "${COMPOSE_FILE}"

          echo ""
          echo "Image:"
          echo "${IMAGE}"

          echo ""
          echo "Commit:"
          echo "${IMAGE_TAG}"


          # ====================================================
          # Validar compose
          # ====================================================

          if [ ! -f "${COMPOSE_FILE}" ]; then

            echo ""
            echo "[FAIL] Compose file not found:"
            echo "${COMPOSE_FILE}"

            echo ""
            echo "Crie a pasta e copie o docker-compose.yml deste repo antes"
            echo "do primeiro deploy: mkdir -p ${APP_DIR} && (copiar arquivo)"

            exit 1

          fi


          # ====================================================
          # Entrar na pasta da aplicação
          # ====================================================

          cd "${APP_DIR}"


          # ====================================================
          # Login GHCR
          # ====================================================

          echo ""
          echo "Authenticating on GHCR..."


          GHCR_TOKEN=$(printf '%s' "${GHCR_TOKEN_B64}" | base64 -d)


          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            -u "${GHCR_USERNAME}" \
            --password-stdin


          unset GHCR_TOKEN


          echo "[OK] GHCR authenticated"


          # ====================================================
          # Pull explícito
          #
          # Isso garante que:
          # - imagem existe
          # - autenticação funciona
          # - arquitetura é compatível
          # ====================================================

          echo ""
          echo "Pulling image..."

          docker pull "${IMAGE}"

          echo "[OK] Image pulled"


          # ====================================================
          # Fixar a imagem resolvida diretamente no compose
          #
          # docker stack deploy não interpola de forma confiável
          # variáveis de ambiente vindas do shell — por isso resolvemos
          # a referência da imagem aqui e gravamos o valor literal no
          # docker-compose.yml antes do deploy (mesma abordagem do
          # rouparia-conectada e bi-hoteis).
          # ====================================================

          sed -i \
            "s|image: ghcr.io/.*/aprovahub-estancorp:.*|image: ${IMAGE}|" \
            "${COMPOSE_FILE}"


          # ====================================================
          # Mostrar imagem resolvida
          # ====================================================

          echo ""
          echo "============================================================"
          echo "Resolved Docker Stack configuration"
          echo "============================================================"


          docker stack config \
            -c "${COMPOSE_FILE}"


          RESOLVED_IMAGE=$(docker stack config \
            -c "${COMPOSE_FILE}" \
            | awk '/^[[:space:]]*image:/ {print $2}' \
            | head -1)


          echo ""
          echo "Expected:"
          echo "${IMAGE}"

          echo ""
          echo "Resolved:"
          echo "${RESOLVED_IMAGE}"


          if [ "${RESOLVED_IMAGE}" != "${IMAGE}" ]; then

            echo ""
            echo "[FAIL] Docker compose resolved an unexpected image."

            echo ""
            echo "Verify the image property inside:"
            echo "${COMPOSE_FILE}"

            exit 1

          fi


          echo ""
          echo "[OK] Stack configuration validated"


          # ====================================================
          # Deploy Swarm
          # ====================================================

          echo ""
          echo "============================================================"
          echo "Deploying Docker Stack"
          echo "============================================================"


          docker stack deploy \
            -c "${COMPOSE_FILE}" \
            "${STACK_NAME}" \
            --with-registry-auth


          echo ""
          echo "[OK] Stack deploy command executed"


          # ====================================================
          # Monitorar Rollout
          #
          # 36 tentativas
          # 10 segundos
          #
          # Máximo aproximado: 6 minutos
          # ====================================================

          echo ""
          echo "============================================================"
          echo "Monitoring rollout"
          echo "============================================================"


          for i in $(seq 1 36); do

            REPLICAS=$(docker service ls \
              --filter "name=${SERVICE_NAME}" \
              --format "{{.Replicas}}" \
              2>/dev/null \
              | head -1)


            if [ -z "${REPLICAS}" ]; then
              REPLICAS="0/0"
            fi


            RUNNING=$(echo "${REPLICAS}" | cut -d/ -f1)

            DESIRED=$(echo "${REPLICAS}" | cut -d/ -f2)


            echo ""
            echo "[$i/36] ${SERVICE_NAME}: ${REPLICAS}"


            # --------------------------------------------------
            # Mostrar erro das últimas tasks caso alguma falhe
            # --------------------------------------------------

            FAILED_TASKS=$(docker service ps "${SERVICE_NAME}" \
              --no-trunc \
              --format "{{.CurrentState}} | {{.Error}}" \
              2>/dev/null \
              | grep -E "Failed|Rejected" \
              || true)


            if [ -n "${FAILED_TASKS}" ]; then

              echo ""
              echo "Detected failed/rejected tasks:"
              echo "${FAILED_TASKS}"

            fi


            # --------------------------------------------------
            # Rollout completo
            # --------------------------------------------------

            if [ "${RUNNING}" = "${DESIRED}" ] && \
               [ "${RUNNING}" -gt 0 ] 2>/dev/null; then

              echo ""
              echo "[OK] All replicas are running"

              echo ""
              echo "============================================================"
              echo "Health Check"
              echo "============================================================"


              # =================================================
              # Health Check
              #
              # Porta publicada pelo Swarm:
              # 8085
              # =================================================

              for h in $(seq 1 12); do

                HTTP=$(curl \
                  --silent \
                  --output /dev/null \
                  --write-out "%{http_code}" \
                  --max-time 5 \
                  "http://127.0.0.1:${APP_PORT}/healthz" \
                  2>/dev/null \
                  || echo "000")


                echo "[health ${h}/12] HTTP ${HTTP}"


                if [ "${HTTP}" = "200" ]; then

                  echo ""
                  echo "============================================================"
                  echo "[OK] DEPLOY SUCCESSFUL"
                  echo "============================================================"

                  echo ""
                  echo "Image:"
                  echo "${IMAGE}"

                  echo ""
                  echo "Service:"
                  echo "${SERVICE_NAME}"

                  echo ""
                  echo "Replicas:"
                  echo "${REPLICAS}"

                  exit 0

                fi


                sleep 5

              done


              # =================================================
              # Health check falhou
              # =================================================

              echo ""
              echo "[FAIL] Health check failed"


              echo ""
              echo "============================================================"
              echo "Docker service status"
              echo "============================================================"


              docker service ps "${SERVICE_NAME}" \
                --no-trunc \
                || true


              echo ""
              echo "============================================================"
              echo "Service logs"
              echo "============================================================"


              docker service logs \
                "${SERVICE_NAME}" \
                --tail 100 \
                2>&1 \
                || true


              exit 1

            fi


            sleep 10

          done


          # ====================================================
          # Timeout
          # ====================================================

          echo ""
          echo "[FAIL] Rollout timed out"


          echo ""
          echo "============================================================"
          echo "Docker service status"
          echo "============================================================"


          docker service ps "${SERVICE_NAME}" \
            --no-trunc \
            || true


          echo ""
          echo "============================================================"
          echo "Docker service logs"
          echo "============================================================"


          docker service logs \
            "${SERVICE_NAME}" \
            --tail 100 \
            2>&1 \
            || true


          exit 1


          DEPLOYEOF


          # ====================================================
          # Substituir apenas valores controlados
          # ====================================================

          sed -i \
            "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" \
            /tmp/deploy.sh

          sed -i \
            "s|REGISTRY_ORG_PLACEHOLDER|${REGISTRY_ORG}|g" \
            /tmp/deploy.sh

          sed -i \
            "s|GHCR_USERNAME_PLACEHOLDER|${GHCR_USERNAME}|g" \
            /tmp/deploy.sh

          sed -i \
            "s|GHCR_TOKEN_B64_PLACEHOLDER|${GHCR_TOKEN_B64}|g" \
            /tmp/deploy.sh


          chmod +x /tmp/deploy.sh


          # ====================================================
          # JSON para AWS SSM
          # ====================================================

          jq \
            -n \
            --rawfile cmd /tmp/deploy.sh \
            '{"commands":[$cmd]}' \
            > /tmp/params.json


          # ====================================================
          # Enviar comando
          # ====================================================

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/params.json \
            --output-s3-bucket-name "estancorp-ssm-logs" \
            --output-s3-key-prefix "aprovahub-estancorp-deployments" \
            --region "${AWS_REGION}" \
            --comment "Deploy aprovahub-estancorp ${IMAGE_TAG}" \
            --query "Command.CommandId" \
            --output text)


          echo ""
          echo "SSM Command ID:"
          echo "${COMMAND_ID}"


          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"


      # --------------------------------------------------------
      # Monitorar execução do SSM
      #
      # 60 × 10 segundos = 10 minutos
      # --------------------------------------------------------

      - name: Monitor SSM command execution

        env:

          COMMAND_ID: ${{ steps.ssm-deploy.outputs.command_id }}

          INSTANCE_ID: ${{ steps.find-instance.outputs.instance_id }}

        run: |

          set -euo pipefail


          for i in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text \
              --region "${AWS_REGION}" \
              2>/dev/null \
              || echo "Unknown")


            echo "[$i/60] Command status: ${STATUS}"


            case "${STATUS}" in

              Success)

                echo ""
                echo "✓ Deployment successful!"

                exit 0

                ;;


              Failed|Cancelled|TimedOut)

                echo ""
                echo "✗ Deployment failed!"

                echo ""
                echo "============================================================"
                echo "SSM command output"
                echo "============================================================"


                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${INSTANCE_ID}" \
                  --region "${AWS_REGION}" \
                  || true


                exit 1

                ;;

            esac


            sleep 10

          done


          echo ""
          echo "✗ SSM command timed out after 10 minutes"

          exit 1


      # --------------------------------------------------------
      # Final
      # --------------------------------------------------------

      - name: Deployment complete

        if: success()

        run: |

          echo "============================================================"
          echo "✓ Deployment completed successfully!"
          echo "============================================================"

          echo ""

          echo "Image:"
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo ""

          echo "Instance:"
          echo "${{ steps.find-instance.outputs.instance_id }}"

          echo ""

          echo "Stack:"
          echo "${{ env.STACK_NAME }}"

          echo ""

          echo "Service:"
          echo "${{ env.SERVICE_NAME }}"
