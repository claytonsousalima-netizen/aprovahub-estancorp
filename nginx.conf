# ============================================================
# Nginx Configuration — AprovaHub Estancorp
#
# - Roteamento por hash no client (index.html sem fallback especial;
#   validate.html é uma segunda entrada estática, sem login)
# - Gzip compression
# - Security headers
# - Asset caching (7 days for versioned files)
# - Healthcheck endpoint
# ============================================================

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # ===== GZIP COMPRESSION =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript
               image/svg+xml;

    # ===== SECURITY HEADERS =====
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ===== ROTEAMENTO =====
    # SPA com roteamento por hash (#pendentes, #documento/<id>...) — o hash
    # nunca chega ao servidor, então basta servir index.html na raiz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página pública de validação de certificado (sem login)
    location = /validate.html {
        try_files $uri =404;
    }

    # ===== ASSET CACHING =====
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ===== HEALTHCHECK ENDPOINT =====
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type "text/plain";
    }

    # ===== LOGGING =====
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
